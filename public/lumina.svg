<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Rounded background -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>

  <!-- Eye mark -->
  <g transform="translate(0,0)" filter="url(#shadow)">
    <path d="M256 160c-84 0-148 56-168 96 20 40 84 96 168 96s148-56 168-96c-20-40-84-96-168-96Z"
          fill="none" stroke="#FFFFFF" stroke-opacity="0.95" stroke-width="16" stroke-linecap="round"/>
    <circle cx="256" cy="256" r="52" fill="#FFFFFF"/>
    <circle cx="256" cy="256" r="24" fill="#059669"/>
    <circle cx="240" cy="240" r="20" fill="url(#iris)"/>
    <!-- spark -->
    <path d="M256 208l5 15 15 5-15 5-5 15-5-15-15-5 15-5 5-15Z"
          fill="#FFFFFF" opacity="0.95"/>
  </g>
</svg>
