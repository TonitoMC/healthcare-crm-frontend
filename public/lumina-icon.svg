<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>Lumina Favicon Icon — Neutral Gray Outline + Emerald Iris</title>
  <desc>Refined, flat favicon-friendly Lumina logo: transparent background, neutral gray outline, emerald iris, white spark.</desc>
  <defs>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Outer eye outline -->
  <path d="M256 144c-84 0-148 56-168 96 20 40 84 96 168 96s148-56 168-96c-20-40-84-96-168-96Z"
        fill="none" stroke="#374151" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Iris -->
  <circle cx="256" cy="256" r="56" fill="url(#iris)"/>

  <!-- Pupil -->
  <circle cx="256" cy="256" r="24" fill="#374151"/>

  <!-- Spark highlight -->
  <path d="M256 208l5 15 15 5-15 5-5 15-5-15-15-5 15-5 5-15Z"
        fill="#FFFFFF" opacity="0.9"/>
</svg>
