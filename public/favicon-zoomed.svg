<?xml version="1.0" encoding="UTF-8"?>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <title>Lumina Favicon Icon — Zoomed-In Version</title>
  <desc>Zoomed-in, perfectly centered Lumina favicon with neutral gray outline and emerald iris.</desc>
  <defs>
    <linearGradient id="iris" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#10B981"/>
    </linearGradient>
  </defs>

  <!-- Outer eye outline (larger and centered) -->
  <path d="M256 104c-100 0-180 64-200 128 20 64 100 128 200 128s180-64 200-128c-20-64-100-128-200-128Z"
        fill="none" stroke="#374151" stroke-width="22" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Iris -->
  <circle cx="256" cy="256" r="68" fill="url(#iris)"/>

  <!-- Pupil -->
  <circle cx="256" cy="256" r="28" fill="#374151"/>

  <!-- Spark highlight -->
  <path d="M256 196l6 18 18 6-18 6-6 18-6-18-18-6 18-6 6-18Z"
        fill="#FFFFFF" opacity="0.9"/>
</svg>
